name = "ai-photography-prompt"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = ".vercel/output/static"

# D1 数据库绑定（生产）不在本文件声明，改在 Cloudflare Pages 项目控制台配置，
# 避免把 database UUID 写进公开仓库：
#   项目 Settings → Functions → D1 database bindings → Variable name 填 `DB`，选数据库 `ai-photography-prompt`
# 本地 `next dev` 不绑 D1，自动走 src/data/seed.ts 种子兜底；首次建表在 D1 控制台 Console 执行 migrations/0001_init.sql
