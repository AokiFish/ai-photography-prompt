name: Deploy → Cloudflare Pages

# push 到 main 即自动构建部署，不依赖 Cloudflare Git 集成的隐式触发——
# 部署失败会在此 workflow 明确报错，避免"代码推了但线上还是旧版"。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: Build for Cloudflare Pages (@cloudflare/next-on-pages)
        run: npm run cf:build

      - name: Deploy to Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 未配置，无法部署。请在仓库 Settings → Secrets 配置（需含 Cloudflare Pages → Edit 权限）。"
            exit 1
          fi
          # 去除 Secrets 粘贴时常带的换行/空格
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          npx --yes wrangler@latest pages deploy .vercel/output/static \
            --project-name=ai-photography-prompt \
            --branch=main \
            --commit-dirty=true
