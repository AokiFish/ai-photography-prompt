name: Collect Prompts (Daily)

# 每天 08:00（北京时间 = 00:00 UTC）采集 PRMPT，更新仓库数据集 data/prompts.sql/.json 并推回 main。
# 推送后由 sync-d1.yml 自动把数据集同步进 Cloudflare D1。
# 也可在 Actions 页面手动 `Run workflow` 触发。
on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 → 北京时间 08:00
  workflow_dispatch: {}

permissions:
  contents: write # 需要把数据集提交回仓库

concurrency:
  group: collect-d1
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1) 抓取来源，更新仓库数据集文件（data/prompts.sql + .json）
      #    LEXICA_PER_QUERY=0：action 跑在数据中心 IP，lexica 被 Cloudflare 拦，跳过以省时间；
      #    本地（住宅 IP 能过 Cloudflare）跑 node scripts/collect.mjs 才会采 lexica。
      - name: Scrape sources → dataset files
        env:
          FETCH_DELAY: "1500" # 请求间隔(ms)
          PRMPT_LIMIT: "12" # PRMPT 单轮最多条数
          LEXICA_PER_QUERY: "0" # action 内跳过 lexica（被 Cloudflare 拦）
        run: node scripts/collect.mjs

      # 2) 提交数据集回仓库（触发 sync-d1.yml 同步 D1）
      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prompts.sql data/prompts.json
          if ! git diff --cached --quiet; then
            git commit -m "data: 每日采集更新 $(date -u +%F)"
            git push origin HEAD:main
          else
            echo "无新数据，跳过提交"
          fi
