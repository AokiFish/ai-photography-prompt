name: Collect Prompts (Daily)

# 每天 08:00（北京时间 = 00:00 UTC）采集 PRMPT，更新仓库数据集 data/prompts.sql/.json 并推回 main。
# 推送后由 sync-d1.yml 自动把数据集同步进 Cloudflare D1。
# 也可在 Actions 页面手动 `Run workflow` 触发。
on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 → 北京时间 08:00
  workflow_dispatch: {}

permissions:
  contents: write # 需要把数据集提交回仓库

concurrency:
  group: collect-d1
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 0) lexica 被 Cloudflare 拦，需无头浏览器过质询；action 内安装 playwright + chromium
      - name: Install Playwright (lexica Cloudflare bypass)
        run: npm install --no-save playwright && npx playwright install --with-deps chromium

      # 1) 抓取来源，更新仓库数据集文件（data/prompts.sql + .json）
      #    PRMPT 不设上限，抓全部 gallery 分页；LEXICA 走浏览器过 Cloudflare 质询采集。
      - name: Scrape sources → dataset files
        env:
          FETCH_DELAY: "1500" # 请求间隔(ms)
          LEXICA_PER_QUERY: "20" # 每个检索词最多条数（浏览器路径）
        run: node scripts/collect.mjs

      # 2) 提交数据集回仓库（触发 sync-d1.yml 同步 D1）
      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prompts.sql data/prompts.json
          if ! git diff --cached --quiet; then
            git commit -m "data: 每日采集更新 $(date -u +%F)"
            git push origin HEAD:main
          else
            echo "无新数据，跳过提交"
          fi
