name: Collect Prompts (Daily)

# 采集 prmpt.it.com 官方分类页 → 更新仓库数据集 data/prompts.sql/.json → 推送 main
# → sync-d1.yml 自动同步进 Cloudflare D1。
#
# 用法：
#   定时（每天 08:00 北京时间）：抓官方全部 12 个分类。
#   手动 Run workflow：可在 category 输入框填单个分类（如 fashion），
#   实现「一个分类一个分类地抓」，便于逐类排查问题。
on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 → 北京时间 08:00
  workflow_dispatch:
    inputs:
      category:
        description: "只抓一个分类（留空=全部12类）。可选: architectural artistic automotive beauty cinematic fashion landscape lifestyle lingerie portrait product romantic"
        required: false
        default: ""

permissions:
  contents: write # 需要把数据集提交回仓库

concurrency:
  group: collect-d1
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 抓取来源 → 更新仓库数据集文件（data/prompts.sql + .json）
      # 注意：不再安装 playwright/chromium——lexica 被 Cloudflare 拦数据中心 IP，
      # action 内采不到（本地住宅 IP 跑 node scripts/collect.mjs 并设
      # LEXICA_PER_QUERY=8 才会走浏览器路径采 lexica）。action 只抓 prmpt。
      - name: Scrape PRMPT (official category pages)
        env:
          FETCH_DELAY: "1500" # 请求间隔(ms)
          PRMPT_CATEGORY: ${{ github.event.inputs.category }} # 手动触发时可选单分类；定时为空=全部
          LEXICA_PER_QUERY: "0" # action 内跳过 lexica
        run: node scripts/collect.mjs

      # 提交数据集回仓库（触发 sync-d1.yml 同步 D1）
      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prompts.sql data/prompts.json
          if ! git diff --cached --quiet; then
            git commit -m "data: 每日采集更新 $(date -u +%F)"
            git push origin HEAD:main
          else
            echo "无新数据，跳过提交"
          fi
