name: Collect Prompts (Daily)

# 每天 08:00（北京时间 = 00:00 UTC）采集 PRMPT 与 Lexica，写入 Cloudflare D1。
# 也可在 Actions 页面手动 `Run workflow` 触发。
on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 → 北京时间 08:00
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collect-d1
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1) 抓取两个源，生成 D1 的 INSERT SQL（落盘 .collect/collect.sql）
      #    采集器内置请求延迟，遵守目标站点的安全抓取间隔。
      - name: Scrape sources → SQL
        env:
          WRITE_D1: "false" # 本步只生成 SQL，写入交给下一步
          FETCH_DELAY: "1500" # 请求间隔(ms)
          PRMPT_LIMIT: "12" # PRMPT 单轮最多条数
          LEXICA_PER_QUERY: "8" # Lexica 每个检索词最多条数
        run: node scripts/collect.mjs

      # 2) 写入远程 D1。需要仓库 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
      #    wrangler.toml 中的 database_id 须替换为真实 D1 数据库 ID。
      - name: Write to Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest d1 execute DB --remote --file=.collect/collect.sql
