name: Sync Dataset → Cloudflare D1

# 仅由采集器（collect.yml）在「采集成功 + 确有更新」后显式触发，
# 或你手动 Run workflow 时执行。这就是「采集成功后才同步 D1」的硬保证：
# sync-d1 不会自己因任何 push 而跑，只认采集器的调用。
#
# 关键修复：不再把全部 INSERT 一次性塞进 `wrangler d1 execute --file`
#   （单次调用有平台语句数/大小限制，会被静默截断 → D1 只写进前面一部分）。
# 改为先由 scripts/split-d1-sql.mjs 拆成每批 ≤20 条的小文件，再用 shell 循环
# 逐批执行；末尾严格校验 D1 行数 == 数据集条数，不符则让工作流失败（问题可见）。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Split SQL into small batches
        run: node scripts/split-d1-sql.mjs

      # 生产红线守卫：批次里若出现 DELETE / TRUNCATE / DROP，立即失败，绝不写库。
      # （生成器已被改为纯 INSERT OR REPLACE，这里是第二道防线：CI 上任何一次
      #   「先删后插」的改动都会被这一步拦下，而不是等到 D1 被清空才发现。）
      - name: Guard: batches must not contain destructive SQL
        run: node scripts/assert-no-destructive-sql.mjs .d1-batches

      - name: Apply batches to D1 (--remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 未配置，跳过写库"
            exit 0
          fi
          # 去除 Secrets 粘贴时常带的换行/空格，避免 Authorization 头格式非法
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          shopt -s nullglob
          for f in .d1-batches/*.sql; do
            echo "▶ 执行 $f"
            npx --yes wrangler@latest d1 execute ai-photography-prompt --remote --file="$f"
          done

      - name: Verify row count matches dataset
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 未配置凭据时「Apply」已跳过写库，这里同样跳过校验（否则无凭据必然误报失败）
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 未配置，跳过行数校验"
            exit 0
          fi
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          EXPECTED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/prompts.json','utf8')).length)")
          # wrangler --json 输出为顶层数组：[{ "results": [{ "total": N }] }]
          # （npx 安装提示走 stderr，不污染 stdout）；容错解析，避免非 JSON 前导导致误判
          RAW=$(npx --yes wrangler@latest d1 execute ai-photography-prompt --remote --command "SELECT COUNT(*) AS total FROM prompts;" --json 2>/tmp/wrangler.err) \
            || { echo "wrangler 执行失败："; cat /tmp/wrangler.err; exit 1; }
          TOTAL=$(printf '%s' "$RAW" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const i=Math.min(s.indexOf('[')<0?1e9:s.indexOf('['), s.indexOf('{')<0?1e9:s.indexOf('{'));
              if(i<1e9) s=s.slice(i);
              let total='';
              try{
                const o=JSON.parse(s);
                const blocks=Array.isArray(o)?o:(o.result&&Array.isArray(o.result)?o.result:(o.results?[o]:[]));
                for(const b of blocks){
                  const rows=b&&b.results?b.results:(b&&b.result?b.result:[]);
                  for(const r of rows){ if(r&&r.total!==undefined){total=r.total;break;} }
                  if(total!=='')break;
                }
              }catch(e){}
              console.log(total);
            })")
          echo "数据集条数 = $EXPECTED | D1 实际条数 = $TOTAL"
          if [ -z "$TOTAL" ]; then
            echo "✘ 读不到 D1 行数（解析为空）。请检查上方批次执行日志。原始返回（前 400 字符）："
            printf '%s' "$RAW" | head -c 400
            exit 1
          fi
          # 同步是「只追加 upsert、绝不删除」，所以判定标准是「D1 不少于数据集」：
          #   少 = 有批次没写进去（截断/语法错）→ 失败；
          #   多 = D1 里还有数据集之外的历史行 → 按红线保留，只告警不删。
          if [ "$TOTAL" -lt "$EXPECTED" ] 2>/dev/null; then
            echo "✘ D1 行数（$TOTAL）少于数据集（$EXPECTED）：有批次未写入，请检查上方批次执行日志。原始返回（前 400 字符）："
            printf '%s' "$RAW" | head -c 400
            exit 1
          fi
          if [ "$TOTAL" -gt "$EXPECTED" ] 2>/dev/null; then
            echo "⚠ D1 比数据集多 $((TOTAL - EXPECTED)) 条（数据集之外的历史行）。同步只追加不删除，按设计保留；如需清理请人工按 id 处理。"
          fi
          echo "✔ 数据集 $EXPECTED 条已全部写入 D1（D1 共 $TOTAL 条）"
