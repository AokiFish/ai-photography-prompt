name: Sync Dataset → Cloudflare D1

# 仓库主分支推送（含每日采集提交、或你手动改代码后提交数据集）时，
# 自动把 data/prompts.sql 同步进 Cloudflare D1。这就是「部署 → 自动同步 D1」。
# 仅当数据集文件变化时才跑，避免无谓同步。
on:
  push:
    branches: [main]
    paths:
      - "data/prompts.sql"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync data/prompts.sql → D1 (--remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 未配置，跳过写库"
            exit 0
          fi
          # 去除 Secrets 粘贴时常带的换行/空格，避免 Authorization 头格式非法
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          # 0) 先清理历史脏数据：早期「首页兜底」采集写入 D1 的记录，
          #    source_url 是站点根（无 /prompt/ 内页），会让弹窗「打开完整网页」跳到源站首页。
          #    prmpt 的有效记录一定来自详情页，URL 必含 /prompt/，此删除不会误伤。
          cat > .d1-cleanup.sql <<'SQL'
          DELETE FROM prompts WHERE source = 'prmpt' AND (source_url IS NULL OR source_url NOT LIKE '%/prompt/%');
          SQL
          npx --yes wrangler@latest d1 execute ai-photography-prompt --remote --file=.d1-cleanup.sql
          # 1) 再把仓库数据集刷进 D1（INSERT OR REPLACE：覆盖同 id、追加新 id）
          npx --yes wrangler@latest d1 execute ai-photography-prompt --remote --file=data/prompts.sql
          # 2) 验证：打印总数 + 脏 URL 数（source_url 不含 /prompt/ 的记录）。
          #    正常应为 bad_url=0；若 >0 说明数据集混入了首页兜底产物，需检查采集路径。
          npx --yes wrangler@latest d1 execute ai-photography-prompt --remote \
            --command "SELECT COUNT(*) AS total, SUM(CASE WHEN source_url IS NULL OR source_url NOT LIKE '%/prompt/%' THEN 1 ELSE 0 END) AS bad_url FROM prompts;"
